title = "Revenium gitleaks configuration"

[extend]
useDefault = true

# Shapes come from hypercurrent APIKeyService.generateKey and HashingConfig:
# <prefix><hashids tenant id, min length 6, alphanumeric>_<32 random bytes as lowercase hex>.
# Entropy 3.0 is far below any real 64-hex secret (lowest of 2M random keys: 3.36)
# and above the repeated-pattern fixtures our tests use (deadbeef...: 2.16).

[[rules]]
id = "revenium-metering-api-key"
description = "Revenium metering API key (rev_mk_)"
regex = '''\b(rev_mk_[A-Za-z0-9]{6,16}_([0-9a-f]{64}))\b'''
secretGroup = 2
entropy = 3.0
keywords = ["rev_mk_"]
tags = ["revenium", "api-key"]

[[rules]]
id = "revenium-write-api-key"
description = "Revenium write API key (rev_sk_)"
regex = '''\b(rev_sk_[A-Za-z0-9]{6,16}_([0-9a-f]{64}))\b'''
secretGroup = 2
entropy = 3.0
keywords = ["rev_sk_"]
tags = ["revenium", "api-key"]

[[rules]]
id = "revenium-read-api-key"
description = "Revenium read-only API key (rev_rk_)"
regex = '''\b(rev_rk_[A-Za-z0-9]{6,16}_([0-9a-f]{64}))\b'''
secretGroup = 2
entropy = 3.0
keywords = ["rev_rk_"]
tags = ["revenium", "api-key"]

[[rules]]
id = "revenium-legacy-api-key"
description = "Legacy Revenium API key (hak_)"
regex = '''\b(hak_[A-Za-z0-9]{6,16}_([0-9a-f]{64}))\b'''
secretGroup = 2
entropy = 3.0
keywords = ["hak_"]
tags = ["revenium", "api-key"]

# Sequential-hex placeholders pass the entropy floor, so they are named explicitly.
[[allowlists]]
description = "Known fake Revenium key secrets"
targetRules = [
  "revenium-metering-api-key",
  "revenium-write-api-key",
  "revenium-read-api-key",
  "revenium-legacy-api-key",
]
regexes = [
  '''^(?:0123456789abcdef){4}$''',
  '''^(?:1234567890abcdef){4}$''',
  '''^(?:abcdef0123456789){4}$''',
  '''^(?:fedcba9876543210){4}$''',
]
